apiVersion: v1
kind: Pod
metadata:
  name: hurricane-readiness-failure
  labels:
    app: hurricane-readiness-failure
spec:
  containers:
  - name: hurricane
    image: django-hurricane-test:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
    - containerPort: 8001
    command: ["python", "manage.py", "serve", "--port=8000", "--probe-port=8001", "--req-queue-len=1", "--workers=2"]
    startupProbe:
      httpGet:
        path: /startup
        port: 8001
      periodSeconds: 1
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: 8001
      periodSeconds: 1
      failureThreshold: 1
