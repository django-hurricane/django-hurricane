apiVersion: v1
kind: Pod
metadata:
  name: hurricane-separate-port
  labels:
    app: hurricane-separate-port
spec:
  containers:
  - name: hurricane
    image: django-hurricane-test:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
    - containerPort: 8001
    command: ["python", "manage.py", "serve", "--port=8000", "--probe-port=8001"]
    startupProbe:
      httpGet:
        path: /startup
        port: 8001
      periodSeconds: 1
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /alive
        port: 8001
      periodSeconds: 2
      timeoutSeconds: 1
    readinessProbe:
      httpGet:
        path: /ready
        port: 8001
      periodSeconds: 2
      timeoutSeconds: 1
