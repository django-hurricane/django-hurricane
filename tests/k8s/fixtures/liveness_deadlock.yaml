apiVersion: v1
kind: Pod
metadata:
  name: hurricane-liveness-healing
  labels:
    app: hurricane-liveness-healing
spec:
  containers:
  - name: hurricane
    image: django-hurricane-test:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
    command: ["python", "manage.py", "serve", "--port=8000", "--probe-port=8000", "--workers=1"]
    startupProbe:
      httpGet:
        path: /startup
        port: 8000
      periodSeconds: 1
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /alive
        port: 8000
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 2
