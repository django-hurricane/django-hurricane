name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codeclimate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install project
      run: uv sync --all-groups --all-extras
    - name: Check code climate
      run: uv run poe lint

  test:
    name: Run unit (w/o Structlog) and integration tests with coverage
    needs: codeclimate
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:  
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}
    - name: Install project
      run: uv sync --all-groups --all-extras --python ${{ matrix.python-version }}
    
    - name: Test with django tests
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 12
        max_attempts: 3
        command: |
          uv run coverage run manage.py test -v 2

  test-structlog:
    name: Run unit (with Structlog) and integration tests with coverage
    needs: codeclimate
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:  
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}
    - name: Install project
      run: uv sync --all-groups --all-extras --python ${{ matrix.python-version }}
    
    - name: Test with django tests
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 12
        max_attempts: 3
        command: |
          uv pip install structlog
          uv run coverage run manage.py test -v 2

    - name: Combine coverage
      run: |
        uv run coverage combine

    - name: Upload coverage data to coveralls.io
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
        COVERALLS_PARALLEL: true
      run: |
        uv run coveralls --service=github

  coveralls:
    name: Indicate completion to coveralls.io
    needs: 
      - test
      - test-structlog
    runs-on: ubuntu-latest
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Finished
      run: |
        uv run python -m pip install --upgrade coveralls
        uv run coveralls --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  load_test:
    name: Run load test with Locust
    needs: 
      - test
      - test-structlog
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}
    - name: Install project
      run: uv sync --all-groups --all-extras --python ${{ matrix.python-version }}
    - name: Run hurricane test server & locust load testing
      run: |
        uv run python manage.py migrate --noinput
        nohup uv run python manage.py serve > /dev/null 2>&1 & uv run locust --headless -u 25 -r 5 --host http://localhost:8000 --run-time 2m

  k8s-test:
    name: Run Kubernetes E2E tests with k3d
    needs: codeclimate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install project
      run: uv sync --all-groups --all-extras --python 3.12

    - name: Install k3d
      run: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

    - name: Run Kubernetes E2E test suite
      run: |
        uv run poe test-k8s
