# This workflow will upload a Python Package to PyPI when a release is published
name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. 2.0.0). Defaults to package version if omitted.'
        required: false
        type: string

jobs:
  build:
    name: Build Django-Hurricane distribution 📦
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Build Python Package
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Upload release 📦 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-hurricane
    permissions:
      id-token: write
    needs: build

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      with:
        skip-existing: true
  
  github-release:
    name: >-
      Sign Django-Hurricane 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.release.tag_name || inputs.tag }}"
        if [ -z "$TAG" ]; then
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # Extract version from built wheel in dist/
            TAG=$(python3 -c "import glob, os, re; whls = glob.glob('dist/*.whl'); print(re.match(r'^django_hurricane-([^-]+)-', os.path.basename(whls[0])).group(1)) if whls else ''")
          fi
        fi

        echo "Target release tag: $TAG"

        if gh release view "$TAG" --repo '${{ github.repository }}' > /dev/null 2>&1; then
          echo "Release $TAG exists. Uploading artifacts..."
          gh release upload "$TAG" dist/* --repo '${{ github.repository }}' --clobber
        else
          echo "Release $TAG does not exist. Creating release and uploading artifacts..."
          gh release create "$TAG" dist/* --repo '${{ github.repository }}' --title "$TAG" --generate-notes
        fi