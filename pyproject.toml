[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-hurricane"
version = "2.0.0rc1"
description = "A Kubernetes Native Stack Specifically Created For Django"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Michael Schilonka", email = "michael@blueshoe.io" },
]
requires-python = ">=3.9"
dependencies = [
    "django>=2.2",
    "requests>=2.25",
    "prometheus-client>=0.17.1",
    "psutil>=5.9.8",
    "granian[reload]>=2.0.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 2.2",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
keywords = [
    "django",
    "kubernetes",
    "hurricane",
]

[project.urls]
Homepage = "https://django-hurricane.io/"
Repository = "https://github.com/django-hurricane/django-hurricane"
Documentation = "https://django-hurricane.io/"

[project.optional-dependencies]
debug = [
    "debugpy>=1.5",
]
pycharm = [
    "pydevd-pycharm>=213.5605.23",
]

[dependency-groups]
dev = [
    "coverage>=1.4",
    "coveralls>=3.3.1",
    "django-stubs[compatible-mypy]>=4.2.4",
    "locust>=1.4",
    "mock>=5.1.0",
    "mypy>=1.5.1",
    "poethepoet>=0.25.0",
    "pytest>=7.0",
    "pytest-kubernetes>=0.9.0; python_version >= '3.11'",
    "ruff>=0.1.0",
    "types-requests>=2.31.0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["hurricane"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length violations (handled by ruff format)
    "F403",  # star imports in test settings
    "F401",  # unused imports
    "E402",  # module level import not at top of file
    "B017",  # assertRaises(Exception) in existing tests
    "B904",  # raise ... from err
]

[tool.ruff.lint.isort]
known-first-party = ["hurricane"]

[tool.mypy]
exclude = ["tests", "docs", "benchmarks"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "k8s: Kubernetes end-to-end integration tests using pytest-kubernetes and k3d",
]

[tool.poe]
include = "tasks.toml"
