repos:
# ruff - fast linter and formatter from Astral
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.0
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

# gitlint - correct git commit format
- repo: https://github.com/jorisroovers/gitlint
  rev: v0.15.0
  hooks:
    - id: gitlint
